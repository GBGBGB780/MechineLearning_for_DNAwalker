[PATHS]
cnn_artifacts_path = ../artifacts/models/cnn

[TRAINING]
# CNN optimizer and run budget / CNN 优化器与训练预算
learning_rate = 0.0005
batch_size = 256
num_epochs = 2000
early_stopping_patience = 200

# CNN checkpoint and fitted label scaler / CNN checkpoint 与标签 scaler
model_save_path = best_mlp_model.pth
x_scaler_file = x_scaler.pkl
# x_scaler_file is retained for legacy configuration compatibility only.
# Current X normalization is per-sample joint-channel z-score and has no scaler.
y_scaler_file = y_scaler.pkl

# ReduceLROnPlateau
scheduler_mode = min
scheduler_factor = 0.5
scheduler_patience = 30
scheduler_min_lr = 1e-6

[MODEL_ARCHITECTURE]
# Input (3, 7801) -> four Conv1d blocks -> adaptive pool -> regression head.
# num_curves and seq_length come from configs/common.ini.
conv1_out_channels = 32
conv1_kernel_size = 21
conv1_stride = 2
conv1_padding = 10

conv2_out_channels = 64
conv2_kernel_size = 5
conv2_stride = 2
conv2_padding = 2

conv3_out_channels = 128
conv3_kernel_size = 5
conv3_stride = 2
conv3_padding = 2

conv4_out_channels = 256
conv4_kernel_size = 3
conv4_stride = 2
conv4_padding = 1

fc1_out_features = 128
dropout_conv = 0.05
dropout_fc = 0.1
