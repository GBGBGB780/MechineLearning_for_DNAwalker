[TRANSFORMER]
# Transformer 超参数 / Transformer hyperparameters
# 当前标准结构使用 patch=100/stride=100。历史运行显示它比旧
# patch=50/stride=25 更省计算，但旧精度数字不具备当前 checkpoint
# provenance，不能据此声称“精度无损”；正式比较必须重新训练。
patch_size = 100
stride = 100
d_model = 256
n_heads = 8
n_layers = 4
d_ff = 512
cross_channel_layers = 2
dropout = 0.15
dropout_head = 0.30
learning_rate = 2.0e-4
weight_decay = 1.0e-4
warmup_ratio = 0.1
scheduler_type = cosine
scheduler_min_lr = 1e-6
batch_size = 64
num_epochs = 300
early_stopping_patience = 40
model_save_path = best_transformer_model.pth
y_scaler_file = transformer_y_scaler.pkl

[PATHS]
dataset_file = ../artifacts/datasets/training_dataset.npz
model_artifacts_dir = ../artifacts/models/transformer
