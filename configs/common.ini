[PHYSICAL_PARAMETERS]
# 在此节中，值为空的参数将被视为需要训练的变量。
# 其他有值的参数将被视为固定常量。

# 1. 动力学与核心能量参数 (待训练)
E_b =
E_b_azo_trans =
E_b_azo_cis =
k_mig =
k0 =
drt_z =
drt_s =

# 2. 结构设计参数 (固定)
n_D1 = 10
n_D2 = 10
n_S1 = 4
n_gray = 10
n_hairpin_1 = 8
n_hairpin_2 = 8
n_azo_1 = 3
n_azo_2 = 3
n_T_hairpin_1 = 3
n_T_hairpin_2 = 2
n_track_1 = 15
n_track_2 = 55

# 3. 基础物理性质参数 (固定)
kBT = 4.14
lp_s = 0.75
lc_s = 0.7
lc_d = 0.34
di_DNA = 2
dE_TYE = -1.55
p_unbind_track = 0.09507

[TRAINING_PARAMETER_RANGES]
# 为每个待训练的参数定义 [min, max] 范围，提升训练性能。
# 范围基于参考值 (E_b=-1.2, E_b_azo_trans=-1.0, E_b_azo_cis=-0.1,
#   k_mig=0.05, k0=8e-6, drt_z=0.5, drt_s=0.05) 及物理约束设计。
default_range = -3.0, 3.0

# k_mig: 分支迁移速率，单位 s^-1。
k_mig = 0.01, 0.30
# k0: Arrhenius 基础解离速率，单位 s^-1。
k0 = 1e-7, 1e-4
# drt_z: 解链(unzipping)方向的力耦合距离，单位 nm。
drt_z = 0.20, 0.90
# drt_s: 剪切(shearing)方向的力耦合距离，单位 nm。
drt_s = 0.01, 0.50

# E_b: 碱基配对结合能，单位 kBT。
E_b = -2.0, -0.5
# E_b_azo_trans: trans-azobenzene 发夹结合能，单位 kBT。
E_b_azo_trans = -2.0, -0.5
# E_b_azo_cis: cis-azobenzene 发夹结合能，单位 kBT。
E_b_azo_cis = -0.5, 0.2


[PATHS]
output_path = ../results
artifacts_path = ../artifacts
dataset_dir = ../artifacts/datasets
# Paths are resolved relative to configs/common.ini.


[NANOROBOT_MODELING]
# 纳米机器人模型相关的特定参数
# 实验数据路径，用于奖励函数中的拟合目标
path_to_experimental_data_a = ../data/experimental/Fig3a_fitting.xlsx

# NanorobotSolver 的动态模拟
# 定义模拟的循环光照时间表
# 每个周期中，可见光阶段的持续时间（分钟）。
cycle_duration_vis = 10.0
# 每个周期中，UV 光阶段的持续时间（分钟）。
cycle_duration_uv = 10.0
# 定义光照循环的起始模式
# 0: 周期以 可见光(vis) 开始 (vis -> uv -> vis -> uv ...)
# 1: 周期以 紫外光(uv) 开始 (uv -> vis -> uv -> vis ...)
light_start_mode = 0
#模拟总时长 (必须与 [TRAINING] 节的 sim_duration_minutes 一致！)
# CRITICAL: dnawalker.{cnn,transformer}.predict 使用此值创建实验数据插值时间轴
# 单位: 分钟，与 [TRAINING] sim_duration_minutes = 130 一致
sim_total_time = 130.0
# 初始构型分布或特定初始构型索引，用于模拟的起始状态
initial_configuration_idx = 0

[DATA_GENERATION]
# [已弃用/DEPRECATED] dnawalker.data.generate 不读取本键；样本数由命令行
# --target 控制（正式默认 10000，冒烟 20）。保留仅作历史配置记录。
num_samples = 10000
# 将每条曲线插值到的标准时间点数量
# (已改为自动读取 [TRAINING] 节中的 seq_length，即 num_time_points = seq_length)
# num_time_points = 12001 (DEPRECATED)
# [已弃用/DEPRECATED] dnawalker.data.generate 不读取本键；并行进程数由命令行
# --workers 控制（默认 os.cpu_count()）。保留仅作历史配置记录。
n_threads = 8
# 输出的数据集文件名
output_filename = training_dataset.npz

# 信号活跃度过滤阈值：max-min 小于此值视为"死寂"样本，丢弃。
# Used by dnawalker.data.generate to drop dead/flat samples.
weak_signal_floor = 0.01

# 活跃度分箱边界 (逗号分隔)，用于均衡分布。
# Activity-bin edges (comma-separated) used for balanced sampling.
bin_edges = 0.01, 0.05, 0.1, 0.2, 0.4, 2.0

[TRAINING]
# 两种逆向模型共用的数据与训练契约 / Shared data and training contract
sim_duration_minutes = 130
# 模拟持续时间（分钟），每秒采样一次，加上初始时间点
# seq_length 将自动计算为: sim_duration_minutes * 60 + 1 = 7801
num_curves = 3
# 输入曲线数量
# 说明：输入数据包含的独立时间序列曲线数量
# 对应：FAM（F+）、TYE（T-）、CY5（M）三条荧光曲线
# 计算：input_size = num_curves * seq_length
# 注意：此值通常固定为3，除非实验设置改变

# 自动计算的参数（程序内部自动计算，无需手动设置）：
# - seq_length = sim_duration_minutes * 60 + 1 = 7801
#   (时间序列长度，即每条曲线的采样点数)
# - input_size = num_curves * seq_length = 23403
#   (神经网络输入层维度，即展平后的总数据点数)

output_size = 7
# 输出参数数量：E_b, E_b_azo_trans, E_b_azo_cis, k_mig, k0, drt_z, drt_s

loss_weight_mode = adaptive
# 损失函数权重模式 (dnawalker.cnn.train 与 dnawalker.transformer.train 均读取):
#   adaptive: 逐参数权重按验证集各参数 MSE 的 EMA 自适应 (预测最差的参数权重最高)。
#             这是 legacy checkpoint 的历史默认行为；旧结果已撤回，当前正式结果需重训。
#   none:     标准等权 MSE，所有参数等权 (配合 Sigmoid 物理边界锁)。

# --- 数据集拆分 ---
test_split_ratio = 0.1
# 测试集比例（10%）

val_split_ratio = 0.1111
# 验证集比例（相对于训练集，最终约10%）

random_seed = 42
# 模型随机种子：控制初始化、shuffle、dropout 等；多种子实验会修改此值。
split_seed = 42
# 固定数据划分种子：所有训练种子必须共享同一 train/val/test 成员关系，
# 防止多种子评估时固定测试集泄漏进其他 seed 的训练集。

[DATA_PROCESSING]
# 共享数据预处理和清洗参数（实现：dnawalker.data.preprocessing）
# 处理流程：加载数据 → 清洗异常值 → 选择性对数变换 → 标准化 → 拆分数据集

safe_threshold = 1e20
# 数据安全阈值，过滤 |数据值| >= 1e20 的异常样本
# 用途：检测并移除 Inf 和极端值

nan_replacement_value = -1e30
# NaN 替换值，将 NaN 替换为此值后用 safe_threshold 过滤

log_transform_params = k0
# 需要做 log10 变换的参数列表（逗号分隔）
# 仅对跨数量级的参数做 log 变换，其余参数保持原值直接进 MinMaxScaler
# k0 范围 [1e-7, 1e-4] 跨 3 个数量级，需要 log 压缩。

log_epsilon = 1e-9
# 对数变换保护值：Y_transformed = log10(Y + 1e-9)
# 仅用于 log_transform_params 中指定的参数
# 用途：避免 log(0) 错误，推荐：1e-9 到 1e-12

# --- 曲线振幅过滤 ---
# 过滤掉"狂暴"样本：如果任一曲线的振幅 (max-min) 超过阈值，则丢弃该样本
# 按通道顺序: FAM(通道0), TYE(通道1), CY5(通道2)
amplitude_filter_enabled = false
amplitude_max_fam = 0.50
amplitude_max_tye = 0.60
amplitude_max_cy5 = 0.50

[PREDICTION]
# 预测阶段参数 / Prediction phase parameters

# Savitzky-Golay 平滑参数 / Savitzky-Golay smoothing parameters
# 用于平滑实验数据，使其质地接近 ODE 模拟曲线
# Smooths experimental data to match ODE simulation curve texture
sg_window = 61
# 平滑窗口大小（必须为奇数）/ Smoothing window size (must be odd)
sg_polyorder = 3
# 拟合多项式阶数 / Polynomial order for fitting

# Test-Time Ensemble 参数 / Test-Time Ensemble parameters
# 对输入施加多次小幅扰动取中位数，提升预测鲁棒性
# Apply small perturbations multiple times and take median for robust prediction
ensemble_size = 50
# 集成次数 / Number of ensemble runs
ensemble_noise_std = 0.005
# 扰动标准差（归一化空间）/ Perturbation std (in normalized space)

# [已弃用/DEPRECATED] Nelder-Mead 局部微调边界。`dnawalker.physics.refinement`
# 现直接在物理参数空间用 TRAINING_PARAMETER_RANGES 作边界 + 越界软惩罚，
# 不读取以下两键；仅为兼容旧配置保留（getter 亦无活动调用方）。
nm_lower_bound = 0.05
nm_upper_bound = 0.95
