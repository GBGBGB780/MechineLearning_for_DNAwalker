[PHYSICAL_PARAMETERS]
# 在此节中，值为空的参数将被视为需要训练的变量。
# 其他有值的参数将被视为固定常量。

# 1. 动力学与核心能量参数 (待训练)
E_b =
E_b_azo_trans =
E_b_azo_cis =
k_mig =
k0 =
drt_z =
drt_s =

# 2. 结构设计参数 (固定)
n_D1 = 10
n_D2 = 10
n_S1 = 4
n_gray = 10
n_hairpin_1 = 8
n_hairpin_2 = 8
n_azo_1 = 3
n_azo_2 = 3
n_T_hairpin_1 = 3
n_T_hairpin_2 = 2
n_track_1 = 15
n_track_2 = 55

# 3. 基础物理性质参数 (固定)
kBT = 4.14
lp_s = 0.75
lc_s = 0.7
lc_d = 0.34
di_DNA = 2
dE_TYE = -1.55
p_unbind_track = 0.09507

[TRAINING_PARAMETER_RANGES]
# 为每个待训练的参数定义 [min, max] 范围，提升训练性能。
# 范围基于参考值 (E_b=-1.2, E_b_azo_trans=-1.0, E_b_azo_cis=-0.1,
#   k_mig=0.05, k0=8e-6, drt_z=0.5, drt_s=0.05) 及物理约束设计。
default_range = -3.0, 3.0

# k_mig: 分支迁移速率，参考值0.05，高于0.20会导致仿真发散
k_mig = 0.01, 0.20
# k0: Arrhenius基础解离速率，参考值8e-6，缩为约一个数量级
k0 = 2e-6, 6e-5
# drt_z: Z方向定向性[0,1]，参考值0.5
drt_z = 0.15, 0.90
# drt_s: S方向定向性[0,1]，参考值0.05，趋近随机
drt_s = 0.001, 0.20

# E_bp: 碱基配对结合能，参考值-1.2 kBT
E_b = -1.8, -0.7
# Ehp-vis: trans-azobenzene发夹结合能，参考值-1.0 kBT
E_b_azo_trans = -1.6, -0.5
# Ehp-UV: cis-azobenzene发夹结合能，参考值-0.1 kBT (cis构型接近0)
E_b_azo_cis = -0.35, -0.01

[EVOSTRAT]
# 进化策略参数，保持与现有代码一致，但可能需要根据纳米机器人模型的复杂性进行调整
# 这些参数控制进化策略的训练过程
repeats = 5
# 整个进化策略运行的重复次数
save_step = 10
# 保存进化策略进度的步长
generations = 100
# 进化策略运行的总代数
population_size = 64
# 进化策略中每一代的种群大小
noise = 0.1
# 噪声标准差，用于进化策略中的探索（sigma）
learning_rate = 0.01
# 学习率，用于更新进化策略中的模型权重
decay = 1.0
# 学习率衰减因子
ss_idx = 0
# 稳态索引，可能用于加载特定的初始构型或稳态信息
n_threads = 8
# 用于并行计算的线程数

[PATHS]
output_path = ./results
# 输出文件和结果的保存路径

[REWARDS]
# 奖励函数类型，根据纳米机器人模型的优化目标进行选择
# 0: 拟合实验数据，1: 优化特定性能指标（如方向性、效率）
reward_flag = 0
# 拟合实验数据的权重，用于奖励函数中，平衡拟合与性能指标
exp_data_weight = 1.0
# 稳定性或方向性指标的权重，用于奖励函数中
performance_weight = 0.5

[NANOROBOT_MODELING]
# 纳米机器人模型相关的特定参数
# 实验数据路径，用于奖励函数中的拟合目标
path_to_experimental_data_a = Fig3a_fitting.xlsx

# NanorobotSolver 的动态模拟
# 定义模拟的循环光照时间表
# 每个周期中，可见光阶段的持续时间（秒）
cycle_duration_vis = 10.0
# 每个周期中，UV光阶段的持续时间（秒）
cycle_duration_uv = 10.0
# 定义光照循环的起始模式
# 0: 周期以 可见光(vis) 开始 (vis -> uv -> vis -> uv ...)
# 1: 周期以 紫外光(uv) 开始 (uv -> vis -> uv -> vis ...)
light_start_mode = 0
#模拟总时长 (必须与 [TRAINING] 节的 sim_duration_minutes 一致！)
# CRITICAL: predict.py 使用此值创建时间轴来插值实验数据
# 单位: 分钟，与 [TRAINING] sim_duration_minutes = 130 一致
sim_total_time = 130.0
# 初始构型分布或特定初始构型索引，用于模拟的起始状态
initial_configuration_idx = 0

[DATA_GENERATION]
# 推荐 10000 到 50000
num_samples = 10000
# 将每条曲线插值到的标准时间点数量
# (已改为自动读取 [TRAINING] 节中的 seq_length，即 num_time_points = seq_length)
# num_time_points = 12001 (DEPRECATED)
# 用于并行生成数据的CPU核心数
n_threads = 8
# 输出的数据集文件名
output_filename = training_dataset.npz

[TRAINING]
# 机器学习训练超参数
# 
# 基础参数
sim_duration_minutes = 130
# 模拟持续时间（分钟），每秒采样一次，加上初始时间点
# seq_length 将自动计算为: sim_duration_minutes * 60 + 1 = 7801
num_curves = 3
# 输入曲线数量
# 说明：输入数据包含的独立时间序列曲线数量
# 对应：FAM（F+）、TYE（T-）、CY5（M）三条荧光曲线
# 计算：input_size = num_curves * seq_length
# 注意：此值通常固定为3，除非实验设置改变

# 自动计算的参数（程序内部自动计算，无需手动设置）：
# - seq_length = sim_duration_minutes * 60 + 1 = 7801
#   (时间序列长度，即每条曲线的采样点数)
# - input_size = num_curves * seq_length = 23403
#   (神经网络输入层维度，即展平后的总数据点数)

output_size = 7
# 输出参数数量：E_b, E_b_azo_trans, E_b_azo_cis, k_mig, k0, drt_z, drt_s

# --- 训练超参数 ---
learning_rate = 0.0005
# 初始学习率，范围：1e-5 到 1e-2

batch_size = 256
# 批次大小，推荐：256, 512, 1024（2的幂次）

num_epochs = 2000
# 训练总轮数，初步测试可用 50-100

# --- 文件路径 ---
model_save_path = best_mlp_model.pth
# 最佳模型保存路径

x_scaler_file = x_scaler.pkl
# 输入数据归一化器（StandardScaler）

y_scaler_file = y_scaler.pkl
# 输出数据归一化器（MinMaxScaler）

# --- 学习率调度器 ---
scheduler_mode = min
# 监控模式：min（损失）或 max（准确率）

scheduler_factor = 0.5
# 学习率衰减因子：新学习率 = 旧学习率 * 0.5

scheduler_patience = 30
# 多少轮验证损失不降就触发学习率衰减

scheduler_min_lr = 1e-6
# 最小学习率下限

# --- 数据集拆分 ---
test_split_ratio = 0.1
# 测试集比例（10%）

val_split_ratio = 0.1111
# 验证集比例（相对于训练集，最终约10%）

random_seed = 42
# 随机种子，保证结果可复现

[MODEL_ARCHITECTURE]
# 1D-CNN 神经网络结构参数（从 model.py 迁移）
# 网络结构：输入(3,7801) → Conv1+Pool(32,~1950) → Conv2+Pool(64,~487) 
#          → Conv3+Pool(128,~121) → Conv4+Pool(256,1) → FC(128) → 输出(7)
# 注意：num_curves 和 seq_length 从 [TRAINING] 节读取

# --- 第一层卷积（识别基础形状）---
conv1_out_channels = 32
# 输出通道数，推荐：16-64

conv1_kernel_size = 21
# 卷积核大小（感受野=21个时间点），推荐：5-31奇数

conv1_stride = 2
# 卷积步长，2表示降采样50%

conv1_padding = 10
# 边界填充，计算：(kernel_size-1)/2

# --- 第二层卷积（识别复杂特征）---
conv2_out_channels = 64
conv2_kernel_size = 5
conv2_stride = 2
conv2_padding = 2

# --- 第三层卷积（提取物理规律）---
conv3_out_channels = 128
conv3_kernel_size = 5
conv3_stride = 2
conv3_padding = 2

# --- 第四层卷积（极致压缩）---
conv4_out_channels = 256
conv4_kernel_size = 3
conv4_stride = 2
conv4_padding = 1

# --- 全连接层（回归预测）---
fc1_out_features = 128
# 中间层维度，推荐：64-256
# 流程：256维卷积特征 → FC(128) → ReLU → FC(7)

[DATA_PROCESSING]
# 数据预处理和清洗参数（从 utils.py 迁移）
# 处理流程：加载数据 → 清洗异常值 → 对数变换 → 标准化 → 拆分数据集

safe_threshold = 1e20
# 数据安全阈值，过滤 |数据值| >= 1e20 的异常样本
# 用途：检测并移除 Inf 和极端值

nan_replacement_value = -1e30
# NaN 替换值，将 NaN 替换为此值后用 safe_threshold 过滤

log_epsilon = 1e-9
# 对数变换保护值：Y_transformed = log10(|Y| + 1e-9)
# 用途：避免 log(0) 错误，推荐：1e-9 到 1e-12