# Local baseline config matching the m03 legacy MHA weighted run.
[TRANSFORMER]
patch_size = 50
stride = 25
d_model = 256
n_heads = 8
n_layers = 4
d_ff = 512
cross_channel_layers = 2
dropout = 0.15
dropout_head = 0.3
learning_rate = 1.0e-4
weight_decay = 1.0e-4
warmup_ratio = 0.1
scheduler_type = cosine
scheduler_min_lr = 1e-6
batch_size = 32
num_epochs = 1000
early_stopping_patience = 150
model_save_path = artifacts/best_transformer_model.current_baseline_local.pth
y_scaler_file = artifacts/transformer_y_scaler.current_baseline_local.pkl

[PATHS]
dataset_file = ../../../results/training_dataset.npz
