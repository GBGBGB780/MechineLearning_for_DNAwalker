[TRANSFORMER]
# 消融实验：容量放大的 Transformer (~4.30M ≈ CNN 4.38M)
# 相对标准配置：n_layers 4 -> 6 (加深时间维 Transformer 块)，其余不变。
# 目的：排除"Transformer 输只是因为容量小"这个混淆变量。
patch_size = 100
stride = 100
d_model = 256
n_heads = 8
n_layers = 6
d_ff = 512
cross_channel_layers = 2
dropout = 0.15
dropout_head = 0.30
learning_rate = 2.0e-4
weight_decay = 1.0e-4
warmup_ratio = 0.1
scheduler_type = cosine
scheduler_min_lr = 1e-6
batch_size = 64
num_epochs = 300
early_stopping_patience = 40
model_save_path = results/best_transformer_ablation_big.pth
y_scaler_file = results/transformer_y_scaler_ablation_big.pkl

[PATHS]
dataset_file = ../results/training_dataset.npz
