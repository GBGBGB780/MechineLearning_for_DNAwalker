[TRANSFORMER]
# Transformer 超参数 / Transformer hyperparameters
# ── 标准配置 (patch=100)：在 Apple Silicon (MPS) 上约 23s/epoch，
#    相比旧 patch=50/stride=25 (~120s/epoch) 提速约 5.6 倍，精度无损。
#    信号曲线极平滑，大 patch 不损时序信息。
patch_size = 100
stride = 100
d_model = 256
n_heads = 8
n_layers = 4
d_ff = 512
cross_channel_layers = 2
dropout = 0.15
dropout_head = 0.30
learning_rate = 2.0e-4
weight_decay = 1.0e-4
warmup_ratio = 0.1
scheduler_type = cosine
scheduler_min_lr = 1e-6
batch_size = 64
num_epochs = 300
early_stopping_patience = 40
model_save_path = results/best_transformer_model.pth
y_scaler_file = results/transformer_y_scaler.pkl

[PATHS]
dataset_file = ../results/training_dataset.npz
