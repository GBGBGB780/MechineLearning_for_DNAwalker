# coding=utf-8
# DNA Walker Transformer 专用配置文件 (TokenMixer 版 - Scaled Up)
# 说明：本配置文件仅包含 Transformer 特定参数。
#       数据集路径、物理参数范围等通用参数继承自上层目录的 configfile.ini。
#
# TokenMixer 约束：
#   d_model 必须同时能被 num_patches 和 num_channels(=3) 整除。
#   当前配置：patch_size=161, stride=80 → num_patches=96
#   d_model=576 → 576/96=6 (temporal d_head), 576/3=192 (cross-channel d_head)

[TRANSFORMER]
# --- Patch 分块参数 ---
patch_size = 161
# 每个 Patch 包含的时间点数
# TokenMixer 要求 d_model % num_patches == 0
# 当前 patch_size=161, stride=80 → num_patches = (7801-161)//80 + 1 = 96

stride = 80
# Patch 滑动步长，约 50% 重叠
# 重叠可增强局部上下文，提升模型对边界特征的感知

# --- 模型结构参数 (Scaled Up) ---
d_model = 576
# Transformer 嵌入维度（Token 维度）
# 必须同时满足: d_model % num_patches == 0 且 d_model % num_channels == 0
# 576 = 2^6 × 3^2, 可被 96(patches) 和 3(channels) 整除
# Scaled from 288 → 576, temporal d_head: 3 → 6, cross-channel d_head: 96 → 192

n_heads = 8
# 保留此参数以兼容接口，TokenMixer 模式下实际不使用
# TokenMixer 的 heads 数自动等于 num_tokens

n_layers = 6
# Temporal TokenMixer Block 数量（时间维度 token 混合层）
# Scaled from 4 → 6, 增加深度以提升特征提取能力

d_ff = 1152
# Feed-Forward Network 中间层维度，通常为 d_model 的 2 倍
# Scaled from 576 → 1152, FFN 是 TokenMixer Block 中唯一的可学习部分，需要足够容量

cross_channel_layers = 3
# 通道间 TokenMixer (Cross-Channel) 的层数
# Scaled from 2 → 3, 加强 FAM/TYE/CY5 三条曲线间的物理关联学习

dropout = 0.15
# TokenMixer + FFN 内部 Dropout 率

dropout_head = 0.3
# 回归头 Dropout 率

# --- 优化器参数 ---
learning_rate = 0.0001
# AdamW 初始学习率。Transformer 通常比 CNN 用更小的 LR
# 建议范围: 1e-5 ~ 5e-4

weight_decay = 0.0001
# AdamW 权重衰减（L2 正则），防止过拟合

# --- 学习率调度 (Cosine Annealing with Warmup) ---
warmup_ratio = 0.1
# Warmup 阶段占总 epochs 的比例
# 例如: 总训练 500 epochs，warmup 前 50 epochs 线性增大 LR 到峰值

scheduler_type = cosine
# 调度器类型: cosine（余弦退火），适合 Transformer 训练

scheduler_min_lr = 1e-6
# 余弦退火最低 LR 下限

# --- 训练超参数 ---
batch_size = 32
# Transformer 的 batch size 通常比 CNN 小（显存限制）
# 根据 GPU 显存调整: 4GB→16, 8GB→32, 16GB→64, 24GB→128
# 如果使用梯度累积可等效放大 effective batch size

num_epochs = 1000
# 训练总轮数

early_stopping_patience = 150
# Early Stopping 耐心值（连续多少 epoch Val MSE 不改善则停止）

# --- 文件路径 ---
model_save_path = results/best_transformer_model.pth
# 相对于 train_transformer/ 目录的保存路径

y_scaler_file = results/transformer_y_scaler.pkl
# Transformer 专用 y_scaler 保存路径

[PATHS]
# 上层目录的数据集文件 / Parent directory dataset file
# 路径相对于 train_transformer/ 目录 / Path relative to train_transformer/ directory
dataset_file = ../results/training_dataset.npz

[AUTOENCODER]
# Encoder-Decoder 联合训练参数 / Encoder-Decoder joint training parameters

# Phase 1: Decoder 独立训练 / Phase 1: Independent Decoder training
decoder_num_epochs = 500
decoder_lr = 0.001
decoder_patience = 100

# Phase 2: 混合 Loss 权重 / Phase 2: Mixed loss weights
# Loss = alpha * Recon_MSE + beta * Param_MSE
alpha_recon = 0.7
beta_param = 0.3

# Phase 3 (可选): 联合微调 / Phase 3 (optional): Joint fine-tuning
phase3_num_epochs = 200
phase3_patience = 50
