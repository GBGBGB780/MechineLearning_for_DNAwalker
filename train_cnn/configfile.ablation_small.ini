# 消融实验：容量受控的 CNN (~3.27M ≈ Transformer 3.24M)
# 仅覆盖 conv4_out_channels 与输出文件名，其余继承根 configfile.ini。
# 目的：排除"CNN 赢只是因为容量大 35%"这个混淆变量。
[MODEL_ARCHITECTURE]
conv4_out_channels = 220

[TRAINING]
model_save_path = best_mlp_model.ablation_small.pth
x_scaler_file = x_scaler.ablation_small.pkl
y_scaler_file = y_scaler.ablation_small.pkl
